<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 420px;">
    <h3>Login</h3>
    {% if message %}<div class="alert alert-warning">{{ message }}</div>{% endif %}
    <form action="{% url 'onlinecourse:login' %}" method="post">
        {% csrf_token %}
        <div class="form-group"><input class="form-control" type="text" name="username" placeholder="Username" required></div>
        <div class="form-group"><input class="form-control" type="password" name="psw" placeholder="Password" required></div>
        <button class="btn btn-primary" type="submit">Login</button>
        <a class="btn btn-link" href="{% url 'onlinecourse:registration' %}">Sign Up</a>
    </form>
</div>
</body>
</html>
